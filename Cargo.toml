[package]
name = "frug"
version = "0.3.0"
edition = "2021"
description = "A simple and learnable gamedev library for rust"
readme = "Readme.md"
homepage = "https://santyarellano.github.io/frug_book/"
repository = "https://github.com/santyarellano/frug"
license = "MIT"
keywords = ["gamedev", "graphics"]


[features]
# By default SDL3, SDL3_image and SDL3_ttf are compiled from bundled source and
# statically linked, so `cargo add frug` works without installing SDL.
# To link against a system-installed SDL instead, depend on frug with
# `default-features = false`.
default = ["bundled"]
bundled = ["sdl3/build-from-source-static"]

[dependencies]
sdl3 = { version = "0.22", features = ["image", "ttf"] }
